/tron2/controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    wf_joint_controller:
      type: tron2_control/WheelFootController

/tron2/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints: [proximal_pitch_L_Joint, proximal_roll_L_Joint, proximal_yaw_L_Joint, knee_L_Joint, wheel_L_Joint, proximal_pitch_R_Joint, proximal_roll_R_Joint, proximal_yaw_R_Joint, knee_R_Joint, wheel_R_Joint]
    interfaces: [position, velocity, effort]

/tron2/imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: base_imu
    frame_id: tron2/base_imu

/tron2/wf_joint_controller:
  ros__parameters:
    joints: [proximal_pitch_L_Joint, proximal_roll_L_Joint, proximal_yaw_L_Joint, knee_L_Joint, wheel_L_Joint, proximal_pitch_R_Joint, proximal_roll_R_Joint, proximal_yaw_R_Joint, knee_R_Joint, wheel_R_Joint]
