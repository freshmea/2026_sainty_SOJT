[project]
name = "sainty-tron2-locomotion"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gymnasium==1.2.0",
    "onnx==1.17.0",
    "onnxruntime==1.23.2",
    "pyyaml==6.0.2",
    "mujoco==3.3.7",
    "numpy==1.26.4",
    "stable-baselines3==2.7.0",
    "torch==2.5.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
