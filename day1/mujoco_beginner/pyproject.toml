[project]
name = "sainty-mujoco-beginner"
version = "0.1.0"
description = "WSL2 MuJoCo beginner exercises for Sainty"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mujoco==3.3.7",
    "numpy==1.26.4",
    "matplotlib==3.9.4",
    "pillow==11.3.0",
    "gymnasium==1.2.0",
    "torch==2.5.1,!=2.5.1+cpu ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "stable-baselines3==2.7.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
policy = [
    "onnx==1.17.0",
    "onnxruntime==1.23.2",
]

[tool.uv]
package = false
