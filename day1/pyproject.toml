[project]
name = "sainty-microduck-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mujoco==3.3.7",
    "numpy==1.26.4",
    "matplotlib==3.9.4",
    "pillow==11.3.0",
    "onnxruntime==1.23.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
