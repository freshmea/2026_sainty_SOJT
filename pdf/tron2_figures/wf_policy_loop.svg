<svg xmlns="http://www.w3.org/2000/svg" width="870" height="247" viewBox="0 0 870 247"><rect width="870" height="247" fill="#f5f7f6"/><g text-anchor="middle" fill="#193d45" font-family="Noto Sans CJK KR, sans-serif"><rect x="12" y="13" width="254" height="72" rx="8" fill="#e3f2ee" stroke="#52776f"/><text x="139" y="43" font-size="22" font-weight="700">MuJoCo 관측</text><text x="139" y="68" font-size="16">IMU · 관절 · 직전 행동</text><rect x="308" y="13" width="254" height="72" rx="8" fill="#fff1d9" stroke="#52776f"/><text x="435" y="43" font-size="22" font-weight="700">encoder.onnx</text><text x="435" y="68" font-size="16">10 × 34 이력 → 잠재값 3개</text><rect x="604" y="13" width="254" height="72" rx="8" fill="#fff1d9" stroke="#52776f"/><text x="731" y="43" font-size="22" font-weight="700">policy.onnx</text><text x="731" y="68" font-size="16">잠재값 3 + 관측 34 + 명령 3</text><rect x="604" y="129" width="254" height="72" rx="8" fill="#fff1d9" stroke="#52776f"/><text x="731" y="159" font-size="22" font-weight="700">행동 10개</text><text x="731" y="184" font-size="16">다리 위치 8 · 바퀴 속도 2</text><rect x="308" y="129" width="254" height="72" rx="8" fill="#e3f2ee" stroke="#52776f"/><text x="435" y="159" font-size="22" font-weight="700">PD → 제한 토크</text><text x="435" y="184" font-size="16">1 ms씩 20회 물리 적분</text><rect x="12" y="129" width="254" height="72" rx="8" fill="#e3f2ee" stroke="#52776f"/><text x="139" y="159" font-size="22" font-weight="700">새 몸체·관절 상태</text><text x="139" y="184" font-size="16">TF / odom / joint_states</text><text x="288" y="58" font-size="27">→</text><text x="582" y="58" font-size="27">→</text><text x="733" y="117" font-size="27">↓</text><text x="583" y="174" font-size="27">←</text><text x="287" y="174" font-size="27">←</text><text x="435" y="232" font-size="17">새 상태를 다음 관측으로 사용한다. 목표가 0이어도 20 ms마다 이 과정을 반복한다.</text></g></svg>